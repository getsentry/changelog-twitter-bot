version: 2
updates:
  # Cloud Function deps. Dependabot updates requirements.in and regenerates
  # the pinned, hashed requirements.txt with pip-compile.
  - package-ecosystem: pip
    directory: /terraform/changelog-twitter-poster
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and
  # the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly

name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the Cloud Function runtime (python311) and the interpreter
          # requirements.txt was compiled for.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            terraform/changelog-twitter-poster/requirements.txt
            requirements-dev.txt

      # Two installs: requirements.txt is hash-pinned and pip rejects a mix of
      # hashed and unhashed requirements in a single invocation.
      - name: install function dependencies
        run: pip install --require-hashes -r terraform/changelog-twitter-poster/requirements.txt

      - name: install test dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest

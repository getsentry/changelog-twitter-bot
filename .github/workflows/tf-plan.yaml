name: Terraform Plan

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: tf plan
    runs-on: ubuntu-latest
    # Only same-repo, human-authored PRs get GCP credentials. GitHub already
    # withholds the OIDC token from fork and Dependabot PRs, so without this
    # guard those runs fail at auth instead of skipping; the guard also keeps
    # the intent explicit if the trigger is ever changed to pull_request_target.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v 6.0.2

      - name: gcp auth (tf plan)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}

      - name: terraform plan
        id: terraform-plan
        uses: dflook/terraform-plan@48e90468aecdd1d8ea21617d4cecf0cd7746ff1d  # v3.1.0
        if:
          ${{ steps.auth.outcome == 'success'}}
        with:
          add_github_comment: changes-only
          path: terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
